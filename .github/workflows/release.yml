name: release

on:
  push:
    branches: [main]

concurrency: release

# The shared release workflow of @drizztdourden08/standards, with its release note steps.
# With changesets pending it runs `standards release-notes version`: `pnpm release:version`
# (changeset version, then the RENAMES.json stamp), then a draft release-notes/v<version>.md,
# all in the "release: version packages" pull request. With none pending it checks the note of
# the current version, refuses to publish while it is a draft or malformed, publishes to GitHub
# Packages and writes the GitHub release v<version> from the note.
jobs:
  release:
    uses: drizztdourden08/standards/.github/workflows/release.yml@v0
    permissions:
      contents: write
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      version: pnpm release:version
