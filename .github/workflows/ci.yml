name: ci

on:
  push:
    branches: [main]
  pull_request:

# The shared gate of @drizztdourden08/standards: standards sync --check, standards release-notes check,
# then the scripts below. The v0 tag follows the latest 0.x release of the standards.
jobs:
  gate:
    uses: drizztdourden08/standards/.github/workflows/ci.yml@v0
    permissions:
      contents: read
      packages: read
    with:
      scripts: lint lint:md structure test storylite:build
